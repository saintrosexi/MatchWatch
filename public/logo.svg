<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="mwGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ff4757" />
    </linearGradient>
    <linearGradient id="mwGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ff4757" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring / Film Reel -->
  <circle cx="50" cy="50" r="44" stroke="url(#mwGoldGrad)" stroke-width="3" opacity="0.4" />
  <circle cx="50" cy="50" r="38" stroke="url(#mwGoldGrad)" stroke-width="4" filter="url(#glow)" />
  
  <!-- Film Sprocket Dots -->
  <circle cx="50" cy="18" r="3.5" fill="#fbbf24" />
  <circle cx="78" cy="35" r="3.5" fill="#fbbf24" />
  <circle cx="78" cy="65" r="3.5" fill="#ff4757" />
  <circle cx="50" cy="82" r="3.5" fill="#ff4757" />
  <circle cx="22" cy="65" r="3.5" fill="#f59e0b" />
  <circle cx="22" cy="35" r="3.5" fill="#fbbf24" />

  <!-- Center Heart & Play Spark Icon -->
  <path d="M50 34 C44 26, 31 30, 31 43 C31 54, 46 64, 50 67 C54 64, 69 54, 69 43 C69 30, 56 26, 50 34 Z" fill="url(#mwGoldGrad)" filter="url(#glow)" />
  <polygon points="46,42 58,49 46,56" fill="#070709" />
</svg>
